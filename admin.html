<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETA Permits — Admin Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a1a; }
.header { background: linear-gradient(135deg, #0C447C, #185FA5); padding: 1rem 1.5rem; color: white; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 1.2rem; font-weight: 600; }
.header .meta { font-size: 12px; opacity: 0.8; }
.main { max-width: 1200px; margin: 0 auto; padding: 1rem; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 1rem; }
.sum-card { background: white; border-radius: 10px; border: 1px solid #e5e7eb; padding: 0.875rem 1rem; }
.sum-card .label { font-size: 11px; color: #9ca3af; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
.sum-card .value { font-size: 22px; font-weight: 700; color: #0C447C; }
.sum-card .sub { font-size: 11px; color: #6b7280; margin-top: 2px; }
.tabs { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
.tab { padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #d1d5db; background: white; color: #6b7280; transition: all 0.15s; }
.tab.active { background: #0C447C; color: white; border-color: #0C447C; }
.tab:hover:not(.active) { background: #f3f4f6; }
.filters { background: white; border-radius: 10px; border: 1px solid #e5e7eb; padding: 0.875rem 1rem; margin-bottom: 1rem; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters input, .filters select { padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; color: #374151; }
.filters input { width: 180px; }
.filters select { width: 150px; }
.filters label { font-size: 12px; color: #6b7280; }
.clear-btn { padding: 7px 14px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-size: 13px; color: #374151; }
.clear-btn:hover { background: #e5e7eb; }
.refresh-btn { padding: 7px 14px; background: #0C447C; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; color: white; }
.refresh-btn:hover { background: #185FA5; }
.table-wrap { background: white; border-radius: 10px; border: 1px solid #e5e7eb; overflow: hidden; }
.table-info { padding: 0.75rem 1rem; font-size: 13px; color: #6b7280; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #0C447C; color: white; padding: 10px 12px; text-align: left; font-size: 12px; font-weight: 500; white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid #f3f4f6; color: #374151; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f9fafb; }
.row-num { color: #9ca3af; font-size: 11px; width: 30px; }
.ref { font-weight: 600; font-family: monospace; font-size: 12px; }
.ref-uk { color: #1e40af; }
.ref-ca { color: #166534; }
.ref-us { color: #991b1b; }
.ref-eu { color: #5b21b6; }
.status-badge { padding: 3px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.s-paid { background: #dcfce7; color: #166534; }
.s-pending { background: #fef3c7; color: #92400e; }
.s-complete { background: #dbeafe; color: #1e40af; }
.s-refunded { background: #fee2e2; color: #991b1b; }
.s-other { background: #f3f4f6; color: #6b7280; }
.amount { font-weight: 600; color: #111; }
.email { color: #185FA5; font-size: 12px; }
.date-cell { font-size: 12px; color: #6b7280; white-space: nowrap; }
.name-cell { font-weight: 500; }
.notes-cell { font-size: 12px; color: #6b7280; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loading { text-align: center; padding: 3rem; color: #9ca3af; }
.loading .spinner { width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #0C447C; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 3rem; color: #9ca3af; font-size: 14px; }
.error-box { background: #fee2e2; border: 1px solid #fca5a5; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; font-size: 13px; color: #991b1b; }
.pdf-link { color: #185FA5; text-decoration: none; font-size: 12px; }
.pdf-link:hover { text-decoration: underline; }
@media (max-width: 768px) {
  table { font-size: 11px; }
  th, td { padding: 7px 8px; }
  .filters input { width: 140px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>🛂 ETA Permits — Admin Dashboard</h1>
  <div class="meta" id="lastUpdated">Loading...</div>
</div>

<div class="main">
  <div id="errorBox" class="error-box" style="display:none;"></div>

  <div class="summary" id="summary">
    <div class="sum-card"><div class="label">Total Orders</div><div class="value" id="s-total">—</div></div>
    <div class="sum-card"><div class="label">UK ETAs</div><div class="value" id="s-uk">—</div></div>
    <div class="sum-card"><div class="label">Canada eTAs</div><div class="value" id="s-ca">—</div></div>
    <div class="sum-card"><div class="label">US ESTAs</div><div class="value" id="s-us">—</div></div>
    <div class="sum-card"><div class="label">EU ETIAS</div><div class="value" id="s-eu">—</div></div>
    <div class="sum-card"><div class="label">Pending</div><div class="value" id="s-pending" style="color:#92400e;">—</div></div>
    <div class="sum-card"><div class="label">Total Revenue</div><div class="value" id="s-revenue">—</div><div class="sub" id="s-revsub"></div></div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="setCountry('ALL',this)">All Orders</div>
    <div class="tab" onclick="setCountry('ETAUK',this)">🇬🇧 UK</div>
    <div class="tab" onclick="setCountry('ETACA',this)">🇨🇦 Canada</div>
    <div class="tab" onclick="setCountry('ETAUS',this)">🇺🇸 US ESTA</div>
    <div class="tab" onclick="setCountry('ETAEU',this)">🇪🇺 EU ETIAS</div>
  </div>

  <div class="filters">
    <input type="text" id="searchName" placeholder="🔍 Search by name..." oninput="applyFilters()">
    <input type="text" id="searchRef" placeholder="🔍 Reference number..." oninput="applyFilters()">
    <input type="text" id="searchEmail" placeholder="🔍 Email..." oninput="applyFilters()">
    <div>
      <label>From</label>
      <input type="date" id="dateFrom" onchange="applyFilters()" style="width:140px; margin-left:4px;">
    </div>
    <div>
      <label>To</label>
      <input type="date" id="dateTo" onchange="applyFilters()" style="width:140px; margin-left:4px;">
    </div>
    <select id="statusFilter" onchange="applyFilters()">
      <option value="">All statuses</option>
      <option value="PAID">PAID</option>
      <option value="PENDING">PENDING</option>
      <option value="COMPLETE">COMPLETE</option>
      <option value="REFUNDED">REFUNDED</option>
    </select>
    <button class="clear-btn" onclick="clearFilters()">Clear</button>
    <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>

  <div class="table-wrap">
    <div class="table-info">
      <span id="tableCount">Loading records...</span>
      <span id="tableRevenue"></span>
    </div>
    <div id="tableContainer">
      <div class="loading"><div class="spinner"></div>Loading orders from CMS...</div>
    </div>
  </div>
</div>

<script>
const WIX_API = 'https://www.etapermits.com/_functions/getApplications';
let allRecords = [];
let currentCountry = 'ALL';

async function loadData() {
  document.getElementById('tableContainer').innerHTML = '<div class="loading"><div class="spinner"></div>Loading orders...</div>';
  document.getElementById('errorBox').style.display = 'none';
  
  try {
    const res = await fetch(WIX_API);
    if (!res.ok) throw new Error('API returned ' + res.status);
    const data = await res.json();
    allRecords = data.items || [];
    document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
    updateSummary();
    applyFilters();
  } catch(err) {
    document.getElementById('errorBox').style.display = 'block';
    document.getElementById('errorBox').innerHTML = `
      <strong>Could not load data from CMS.</strong><br>
      You need to create a Wix HTTP function called <code>getApplications</code> in your backend.<br>
      Error: ${err.message}
    `;
    document.getElementById('tableContainer').innerHTML = '<div class="empty">No data loaded. See error above.</div>';
  }
}

function updateSummary() {
  const uk = allRecords.filter(r => (r.reference||'').startsWith('ETAUK')).length;
  const ca = allRecords.filter(r => (r.reference||'').startsWith('ETACA')).length;
  const us = allRecords.filter(r => (r.reference||'').startsWith('ETAUS')).length;
  const eu = allRecords.filter(r => (r.reference||'').startsWith('ETAEU')).length;
  const pending = allRecords.filter(r => (r.status||'').toUpperCase() === 'PENDING').length;
  const revenue = allRecords
    .filter(r => (r.status||'').toUpperCase() !== 'REFUNDED')
    .reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);

  document.getElementById('s-total').textContent = allRecords.length;
  document.getElementById('s-uk').textContent = uk;
  document.getElementById('s-ca').textContent = ca;
  document.getElementById('s-us').textContent = us;
  document.getElementById('s-eu').textContent = eu;
  document.getElementById('s-pending').textContent = pending;
  document.getElementById('s-revenue').textContent = '£' + revenue.toFixed(0);
  document.getElementById('s-revsub').textContent = 'excl. refunds';
}

function setCountry(c, el) {
  currentCountry = c;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const name = document.getElementById('searchName').value.toLowerCase().trim();
  const ref = document.getElementById('searchRef').value.toLowerCase().trim();
  const email = document.getElementById('searchEmail').value.toLowerCase().trim();
  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo = document.getElementById('dateTo').value;
  const status = document.getElementById('statusFilter').value.toUpperCase();

  let filtered = allRecords.filter(r => {
    const refStr = (r.reference || '').toUpperCase();
    const nameStr = (r.name || '').toLowerCase();
    const emailStr = (r.email || '').toLowerCase();
    const statusStr = (r.status || '').toUpperCase();
    const dateStr = r.date ? r.date.substring(0, 10) : '';

    if (currentCountry !== 'ALL' && !refStr.startsWith(currentCountry)) return false;
    if (name && !nameStr.includes(name)) return false;
    if (ref && !refStr.includes(ref.toUpperCase())) return false;
    if (email && !emailStr.includes(email)) return false;
    if (status && statusStr !== status) return false;
    if (dateFrom && dateStr < dateFrom) return false;
    if (dateTo && dateStr > dateTo) return false;
    return true;
  });

  renderTable(filtered);
}

function getRefClass(ref) {
  if (!ref) return '';
  if (ref.startsWith('ETAUK')) return 'ref-uk';
  if (ref.startsWith('ETACA')) return 'ref-ca';
  if (ref.startsWith('ETAUS')) return 'ref-us';
  if (ref.startsWith('ETAEU')) return 'ref-eu';
  return '';
}

function getStatusClass(s) {
  if (!s) return 's-other';
  const u = s.toUpperCase();
  if (u.includes('PAID')) return 's-paid';
  if (u.includes('PENDING')) return 's-pending';
  if (u.includes('COMPLETE')) return 's-complete';
  if (u.includes('REFUND')) return 's-refunded';
  return 's-other';
}

function formatDate(d) {
  if (!d) return '—';
  try {
    return new Date(d).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
  } catch(e) { return d; }
}

function renderTable(data) {
  const revenue = data
    .filter(r => (r.status||'').toUpperCase() !== 'REFUNDED')
    .reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);

  document.getElementById('tableCount').textContent = `Showing ${data.length} record${data.length !== 1 ? 's' : ''}`;
  document.getElementById('tableRevenue').textContent = data.length ? `Revenue: £${revenue.toFixed(2)}` : '';

  if (!data.length) {
    document.getElementById('tableContainer').innerHTML = '<div class="empty">No records match your filters</div>';
    return;
  }

  const rows = data.map((r, i) => {
    const refClass = getRefClass(r.reference);
    const statusClass = getStatusClass(r.status);
    const currency = (r.reference||'').startsWith('ETAUK') ? '£' :
                     (r.reference||'').startsWith('ETACA') ? 'CA$' :
                     (r.reference||'').startsWith('ETAUS') ? 'US$' : '€';
    return `<tr>
      <td class="row-num">${i + 1}</td>
      <td class="date-cell">${formatDate(r.date)}</td>
      <td><span class="ref ${refClass}">${r.reference || '—'}</span></td>
      <td class="name-cell">${r.name || '—'}</td>
      <td class="email">${r.email || '—'}</td>
      <td class="amount">${r.amount ? currency + r.amount : '—'}</td>
      <td><span class="status-badge ${statusClass}">${r.status || '—'}</span></td>
      <td class="notes-cell" title="${r.notes || ''}">${r.notes || '—'}</td>
      ${r.pdfUrl ? `<td><a href="${r.pdfUrl}" target="_blank" class="pdf-link">PDF ↗</a></td>` : '<td>—</td>'}
    </tr>`;
  }).join('');

  document.getElementById('tableContainer').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Date</th>
          <th>Reference</th>
          <th>Name</th>
          <th>Email</th>
          <th>Amount</th>
          <th>Status</th>
          <th>ETA / Notes</th>
          <th>PDF</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function clearFilters() {
  document.getElementById('searchName').value = '';
  document.getElementById('searchRef').value = '';
  document.getElementById('searchEmail').value = '';
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  document.getElementById('statusFilter').value = '';
  applyFilters();
}

loadData();
</script>
</body>
</html>
